- id: "POL-S3-001"
  name: "Default Server-Side Encryption"
  service: "s3"
  severity: "HIGH"
  description: "All S3 storage must have default server-side encryption enabled to protect electronic health records."
  remediation: "Enable default server-side encryption for the S3 bucket."
  conditions:
    all:
      - field: "storage_encrypted"
        operator: "is_true"
        value: true

- id: "POL-RDS-001"
  name: "Disallow Public RDS Instances"
  service: "rds"
  severity: "CRITICAL"
  description: "RDS database instances must not be publicly accessible to prevent unauthorized access to electronic health records."
  remediation: "Modify the RDS instance to be privately accessible."
  conditions:
    all:
      - field: "publicly_accessible"
        operator: "is_false"
        value: true

- id: "POL-IAM-001"
  name: "Enforce MFA for IAM Users"
  service: "iam"
  severity: "HIGH"
  description: "All console IAM users must have MFA enabled to add an extra layer of security for accessing electronic health records."
  remediation: "Enable MFA for the IAM user."
  conditions:
    all:
      - field: "mfa_enabled"
        operator: "is_true"
        value: true

- id: "POL-VPC-001"
  name: "Enable VPC Flow Logs"
  service: "vpc"
  severity: "MEDIUM"
  description: "VPC Flow Logs must be enabled to monitor network traffic and detect potential security threats."
  remediation: "Enable VPC Flow Logs for the VPC."
  conditions:
    all:
      - field: "flow_logs_enabled"
        operator: "is_true"
        value: true

- id: "POL-CT-001"
  name: "Enable CloudTrail Logging"
  service: "cloudtrail"
  severity: "CRITICAL"
  description: "CloudTrail logging must be enabled across all regions to track API calls and detect security incidents."
  remediation: "Enable CloudTrail logging for all regions."
  conditions:
    all:
      - field: "is_logging"
        operator: "is_true"
        value: true