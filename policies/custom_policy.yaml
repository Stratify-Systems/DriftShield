- id: "POL-S3-001"
  name: "Enforce S3 Storage Encryption"
  service: "s3"
  severity: "CRITICAL"
  description: "All S3 buckets must have server-side encryption enabled to protect ePHI"
  remediation: "Enable default encryption for the S3 bucket"
  conditions:
    all:
      - field: "storage_encrypted"
        operator: "is_true"
        value: true

- id: "POL-RDS-001"
  name: "Prohibit Publicly Accessible RDS Databases"
  service: "rds"
  severity: "CRITICAL"
  description: "RDS databases must not be publicly accessible to prevent unauthorized access to ePHI"
  remediation: "Modify the RDS instance to not be publicly accessible"
  conditions:
    all:
      - field: "publicly_accessible"
        operator: "is_false"
        value: true

- id: "POL-EC2-001"
  name: "Disallow Open SSH Port 22"
  service: "ec2"
  severity: "CRITICAL"
  description: "Security groups must not allow inbound TCP port 22 from 0.0.0.0/0 to prevent unauthorized SSH access"
  remediation: "Restrict SSH ingress to bastion CIDR ranges"
  conditions:
    none_rule:
      port: 22
      protocol: "tcp"
      source: "0.0.0.0/0"

- id: "POL-EC2-002"
  name: "Disallow Open RDP Port 3389"
  service: "ec2"
  severity: "CRITICAL"
  description: "Security groups must not allow inbound TCP port 3389 from 0.0.0.0/0 to prevent unauthorized RDP access"
  remediation: "Restrict RDP ingress to bastion CIDR ranges"
  conditions:
    none_rule:
      port: 3389
      protocol: "tcp"
      source: "0.0.0.0/0"

- id: "POL-RDS-002"
  name: "Mandate RDS Storage Deletion Protection"
  service: "rds"
  severity: "HIGH"
  description: "RDS instances must have deletion protection enabled to prevent accidental deletion of ePHI"
  remediation: "Enable deletion protection for the RDS instance"
  conditions:
    all:
      - field: "deletion_protection"
        operator: "is_true"
        value: true