- id: POL-S3-001
  name: Enforce S3 Public Access Block
  service: s3
  severity: HIGH
  description: All S3 buckets must have public access block settings enabled.
  remediation: Enable BlockPublicAcls and BlockPublicPolicy on the S3 bucket.
  conditions:
    all:
      - field: public_access_block.BlockPublicAcls
        operator: equals
        value: true
      - field: public_access_block.BlockPublicPolicy
        operator: equals
        value: true
